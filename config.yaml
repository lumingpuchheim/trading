# seller-decay screener — all tunable numbers live here.
# Sections marked FIXED are part of the spec and must never be tuned.

data:
  start_date: "2005-01-01"        # download start
  cache_dir: "data"               # parquet cache location
  min_price: 5.0                  # filter: close > $5
  min_dollar_volume: 5_000_000    # filter: avg daily dollar volume > $5M
  dollar_volume_window: 20        # days used to compute avg dollar volume
  benchmark: "SPY"

trend_filter:                     # section 2 — all conditions must hold
  sma_fast: 50
  sma_mid: 150
  sma_slow: 200
  sma_slow_rising_lookback: 20    # 200-day SMA higher than 20 trading days ago
  min_above_52w_low: 1.30         # close >= 1.30 x 52-week low
  min_of_52w_high: 0.75           # close >= 0.75 x 52-week high
  week52_window: 250              # trading days used for 52-week high/low

base:                             # section 3 — mechanical base definition
  high_window: 250                # H = highest close in last 250 trading days
  start_threshold: 0.98           # base start: first day with close >= 0.98 x H
  max_above_high: 1.03            # invalid if close ever > 1.03 x H since start
  min_below_high: 0.70            # invalid if close ever < 0.70 x H since start
  min_length: 20                  # trading days
  max_length: 90                  # trading days

model:                            # section 4 — seller-decay fit
  fit_window: 40                  # N: last N trading days of the base
  baseline_window: 120            # normalisation window for range and volume
  min_valid_points: 20            # min usable (positive, finite) points for a fit
  sanity_r2_min: 0.05             # FIXED sanity filter: r2_range and r2_vol above this

learning:                         # section 5 — fitted on development period ONLY
  return_cap: 1.0                 # cap trade returns at +100% for fitting
  ridge_penalties: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  penalty_folds:                  # walk-forward inside the development period
    - {fit_end: "2012-12-31", score_start: "2013-01-01", score_end: "2015-12-31"}
    - {fit_end: "2015-12-31", score_start: "2016-01-01", score_end: "2018-12-31"}
  top_fraction: 0.10              # penalty scored on avg return of top 10% ranked bases
  n_r2_buckets: 5                 # buckets for the 5c tables and shrink()
  n_edge_buckets: 5               # buckets for the Kelly table
  kelly_multiplier: 0.25          # FIXED: quarter-Kelly, never optimised
  lambda_top_fraction: 0.20       # strategy 3: top 20% of dev lambda distribution

lppl:                             # Sornette bubble detector — all frozen before any backtest
  windows: [125, 175, 250, 350, 500]  # trading-day window lengths, fitted jointly
  min_votes: 3                    # "in bubble" needs >= 3 of 5 windows qualified
  min_votes_loose: 2              # earlier, less certain flag for the *2 strategies
  tc_min_ahead: 5                 # grid: critical time 5 .. 0.5*window days ahead
  tc_max_ahead_frac: 0.5          # 1.0 was tried 2026-08-25 and hurt the dev period; reverted
  tc_points: 20
  m_min: 0.1                      # power-law exponent range (Sornette-style)
  m_max: 0.9
  m_points: 10
  w_min: 6.0                      # log-periodic frequency range
  w_max: 13.0
  w_points: 10
  min_r2: 0.80                    # qualification of the best grid point
  min_damping: 1.0                # trend must dominate the oscillation
  refit_every: 5                  # trading days between evaluations per stock
  persistence: 2                  # consecutive qualified evaluations before tradeable
  prescreen_lookback: 125         # run-up window for the cheap pre-screen
  prescreen_min_runup: 0.20       # +20% over the lookback, and accelerating
  dip_from_high: 0.04             # entry: close >= 4% below its 20-day high close
  dip_high_window: 20
  curve_band_sigma: 3.0           # _guard: entry only if log-price >= fitted curve - 3 sigma
  rs_lookback: 126                # _rs: rank slot candidates by trailing 126-day return
  dip_max_from_high: 0.10         # _band: a dip deeper than 10% below the 20d high is off-model
  breadth_veto_max: 5             # _breadth: >5 simultaneous new candidates = systemic, take none
  validation_sample: 500          # rejected stock-days re-fitted to verify the pre-screen
  watchlist_days: 0               # pre-screen watchlist exemption, 0 = off; 126 tested 2026-08-26 and rejected (dev collapses, see FINDINGS)
  prescreen_anti_drawdown: 0.25   # anti-bubble pre-screen: >= 25% below the 252d high ...
  prescreen_anti_sma: 200         # ... and below the 200d SMA (ANTIBUBBLE_SPEC)

lppl_trading:                     # 8% stop, tc exit, equal weight
  stop_loss: 0.92                 # exit if close <= 0.92 x entry (the "8% leaving rule")
  sma_exit: 50                    # _ma variant: exit when close < 50-day SMA
  max_positions: 10
  equal_weight_fraction: 0.10
  cost_per_side: 0.002
  reentry_cooldown: 20
  dip_only_max_hold: 60           # dip_only ablation has no tc; time cap instead
  episode_gap: 20                 # flag off this many trading days = the bubble episode ended

minervini:                        # Stage-2 breakout — FROZEN by MINERVINI_SPEC.md v2
  sma_fast: 50                    # trend template, conditions 1-6 (v1, unchanged)
  sma_mid: 150
  sma_slow: 200
  sma_slow_rising_lookback: 21    # SMA200 higher than 21 trading days ago
  week52_window: 250              # trading days used for the 52-week levels
  min_above_52w_low: 1.30         # condition 7
  min_of_52w_high: 0.75           # condition 8
  rs_lookback: 126                # condition 9: trailing 126d return ...
  rs_top_fraction: 0.30           # ... in the top 30% of the liquid universe
  base_lookback: 325              # rim B = highest close of the trailing 325d
  base_age_min: 15                # 3 weeks, the source minimum (v1 had 20)
  base_age_max: 325               # 65 weeks, the source maximum (v1 had 90)
  max_correction: 0.35            # deeper than this since day(B) = prior cycle,
                                  # re-anchor the rim past the trough
  zigzag_threshold: 0.03          # confirmed swing = a 3% close reversal
  min_contractions: 2             # at least two pullbacks in the base
  final_contraction_max: 0.10     # the last one no deeper than 10%
  pivot_min_of_base: 0.90         # pivot must sit in the top tenth of the base
  dryup_window: 5                 # a quiet DAY in the last 5 (v1 used a mean) ...
  dryup_long: 50
  dryup_max_ratio: 0.75           # ... at or below 75% of the 50d mean volume
  breakout_volume_mult: 1.5       # close-of-day confirmation: 1.5x the 50d mean
  buy_stop_offset: 0.001          # resting buy stop just over the pivot
  max_chase: 0.05                 # never pay more than 5% over the pivot

minervini_fundamentals:           # SEPA pillar 2 — FROZEN by MINERVINI_SPEC.md §8b
  min_quarters: 8                 # F0: quarterly EPS reports needed (g4 uses q[-8])
  quarter_growth_min: 0.25        # F1: MOST RECENT quarter vs a year ago, >= +25%
  accel_quarters: 3               # F2: g1 > g2 > g3 > g4, strictly rising
  max_report_age_days: 120        # F3: latest report no older than this
  require_beat: false             # F4 (§8c): latest report beat consensus;
                                  # enabled by --beat, never both-ways scanned

minervini_v3:                     # §9 overlay, applied by --v3 — FROZEN
  require_higher_lows: true       # every trough strictly above the previous
  earnings_blackout_days: 21      # no setup with a report inside 21 calendar days
  decisive_break_frac: 0.01       # trend exit: close > 1% below the SMA50 ...
  decisive_volume: true           # ... or below it on above-average volume
  breakeven_r: 2                  # a +2R winner may not become a loss

minervini_v4:                     # §10.1 + 10.2 overlay, applied by --v4 — FROZEN
  protect_days: 15                # tennis-ball window: only the 8% stop may sell
  strength_sell_at: 1.20          # from day 15 on, sell half at +20% ...
  strength_sell_frac: 0.5         # ... and let the rest run on the v3 trend rules
  rank_selection: true            # slots fill by (RS-line-at-high, holds-up-when-
                                  # weak score, RS return), not alphabetically

minervini_trading:                # portfolio mechanics, identical to lppl_dip2
  stop_loss: 0.92                 # close <= 0.92 x entry -> sell next open
  sma_exit: 50                    # close < SMA50 (trend death) -> sell next open
  max_positions: 10
  equal_weight_fraction: 0.10
  cost_per_side: 0.002
  reentry_cooldown: 20
  n_controls: 200                 # random template-passing control portfolios

trading:                          # section 6 — FIXED, never tuned
  stop_loss: 0.92                 # exit if close <= 0.92 x entry
  sma_exit: 50                    # exit if close < 50-day SMA
  max_holding_days: 60            # trading days
  max_positions: 10
  equal_weight_fraction: 0.10     # strategies 2-5: 10% of portfolio per position
  max_position_fraction: 0.15     # cap any single position at 15% of portfolio
  max_total_exposure: 1.0         # skip entries that would breach 100% invested
  cost_per_side: 0.002            # 0.2% per side
  reentry_cooldown: 20            # no re-entry within 20 days of an exit

backtest:                        # section 7
  start: "2007-01-01"
  dev_end: "2018-12-31"          # development period: 2007 - 2018
  test_start: "2019-01-01"       # test period: 2019 - today
  random_seed: 42                # for template and random strategies
  results_dir: "results"
